<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DliCOM Sticker Studio</title>
<style>
:root{--bg:#050914;--panel:#09142d;--panel2:#0c1b3b;--line:#1f3d78;--blue:#2f6bff;--blue2:#5e8dff;--text:#f7fbff;--muted:#9fb1d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#123277 0,#07112a 38%,#030711 100%);color:var(--text);font:14px Inter,Arial,sans-serif;min-height:100vh}.app{max-width:1250px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:#fff;color:#1451dc;display:grid;place-items:center;font-size:24px;font-weight:1000}.brand b{font-size:20px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#0a1733;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:9px}.tab{white-space:nowrap}.tab.active{background:var(--blue)}.layout{display:grid;grid-template-columns:285px 1fr 225px;gap:12px}.panel,.stage{background:rgba(7,18,43,.94);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:0 15px 45px #0005}.sectionTitle{font-size:12px;font-weight:900;color:#c7d6f4;text-transform:uppercase;letter-spacing:.6px;margin:2px 0 9px}.assetGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:650px;overflow:auto;padding-right:2px}.asset{aspect-ratio:1;border:1px solid #294b8e;border-radius:12px;background:#050b1a;display:grid;place-items:center;padding:5px;cursor:pointer}.asset:hover{border-color:var(--blue2);transform:translateY(-1px)}.asset img{width:100%;height:100%;object-fit:contain}.empty{color:#7e91b9;text-align:center;padding:30px 8px;grid-column:1/-1}.stage{padding:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.canvasWrap{margin-top:10px;border:1px solid #284780;border-radius:15px;padding:16px;display:grid;place-items:center;background:repeating-conic-gradient(#e9edf4 0 25%,#fff 0 50%) 50%/24px 24px}.canvas{width:min(760px,100%);aspect-ratio:1;position:relative;overflow:hidden}.layer{position:absolute;left:50%;top:50%;width:42%;transform:translate(-50%,-50%) rotate(0deg);touch-action:none;cursor:grab;user-select:none}.layer img{display:block;width:100%;height:auto;pointer-events:none}.layer.selected{outline:2px solid #5e8dff;outline-offset:4px;border-radius:6px}.right h3{margin:2px 0 10px;font-size:13px}.preview{aspect-ratio:1;border-radius:12px;background:repeating-conic-gradient(#e9edf4 0 25%,#fff 0 50%) 50%/18px 18px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.preview img{max-width:90%;max-height:90%;object-fit:contain}.info{margin-top:10px;padding:10px;border-radius:11px;background:#07122b;border:1px solid #1d376c;color:var(--muted);font-size:11px;line-height:1.5}.drop{margin-top:10px;border:1px dashed #4f76c7;border-radius:11px;padding:10px;text-align:center;color:#9fb1d4}.drop input{width:100%;margin-top:8px}.range{width:100%}.hint{color:#8296bd;font-size:11px;line-height:1.5;margin-top:9px}@media(max-width:950px){.layout{grid-template-columns:240px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:180px 1fr;gap:10px}.right h3{grid-column:1/-1}}@media(max-width:700px){.app{padding:10px}.head{align-items:flex-start}.actions .secondary{display:none}.layout{grid-template-columns:1fr}.panel{order:2}.stage{order:1}.right{order:3;display:block}.assetGrid{grid-template-columns:repeat(4,1fr);max-height:240px}.canvasWrap{padding:8px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="brand"><div class="mark">D</div><div><b>DliCOM Sticker Studio</b><span>Create • Customize • Download</span></div></div><div class="actions"><button class="btn secondary" id="clear">Clear</button><button class="btn primary" id="download">Download PNG</button></div></header>
<nav class="tabs" id="tabs"><button class="btn tab active" data-cat="mascot">Mascot Poses</button><button class="btn tab" data-cat="base">Mascot Base</button><button class="btn tab" data-cat="gear">Accessories & Gear</button><button class="btn tab" data-cat="text">Text Stickers</button><button class="btn tab" data-cat="logo">DliCOM Logo</button></nav>
<div class="layout">
<aside class="panel"><div class="sectionTitle" id="catTitle">Mascot Poses</div><div class="assetGrid" id="assets"><div class="empty">Loading stickers…</div></div><div class="drop">Add your own PNG/JPG/WebP<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></div></aside>
<main class="stage"><div class="toolbar"><button class="btn primary" id="addText">+ Text</button><button class="btn" id="smaller">− Size</button><button class="btn" id="larger">+ Size</button><button class="btn" id="rotateL">↶ Rotate</button><button class="btn" id="rotateR">↷ Rotate</button><button class="btn" id="delete">Delete</button></div><div class="canvasWrap"><div class="canvas" id="canvas"></div></div><div class="hint">Tap a sticker to add it. Drag to move. Select it to resize or rotate. Export is transparent PNG.</div></main>
<aside class="panel right"><h3>Selected Sticker</h3><div class="preview" id="preview"><span style="color:#8195bd;font-size:11px">Nothing selected</span></div><div class="info" id="info">Add a mascot, gear, text sticker or logo to start.</div><div style="margin-top:10px"><label style="font-size:11px;color:#a8b9da">Size</label><input class="range" id="size" type="range" min="12" max="90" value="42"></div><div style="margin-top:10px"><label style="font-size:11px;color:#a8b9da">Rotation</label><input class="range" id="angle" type="range" min="-180" max="180" value="0"></div></aside>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const RAW='https://raw.githubusercontent.com/Jayanta7667/dlicom-sticker-studio/main/';
const sheets={mascot:['mascot-poses.png','Mascot Poses'],base:['mascot-base.png','Mascot Base'],gear:['accessories-gear.png','Accessories & Gear'],text:['text-stickers.png','Text Stickers'],logo:['dlicom-logo.png','DliCOM Logo']};
const A={mascot:[],base:[],gear:[],text:[],logo:[]};let cat='mascot',selected=null,z=1;
const $=id=>document.getElementById(id),assets=$('assets'),canvas=$('canvas');
function setCat(c){cat=c;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));$('catTitle').textContent=sheets[c][1];render()}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)setCat(b.dataset.cat)};
function render(){assets.innerHTML=A[cat].length?A[cat].map((x,i)=>`<button class="asset" title="${x.name}" data-i="${i}"><img src="${x.src}" alt=""></button>`).join(''):'<div class="empty">Loading stickers…</div>'}
assets.onclick=e=>{const b=e.target.closest('.asset');if(b)addAsset(A[cat][+b.dataset.i])};
function select(el){if(selected)selected.classList.remove('selected');selected=el;if(el){el.classList.add('selected');$('size').value=parseFloat(el.style.width)||42;$('angle').value=parseFloat(el.dataset.angle||0);const im=el.querySelector('img');$('preview').innerHTML=`<img src="${im.src}">`;$('info').textContent='Selected sticker • drag on canvas to move.'}else{$('preview').innerHTML='<span style="color:#8195bd;font-size:11px">Nothing selected</span>';$('info').textContent='Add a sticker to start.'}}
function addAsset(x){const el=document.createElement('div');el.className='layer';el.style.width='42%';el.style.zIndex=++z;el.dataset.angle='0';el.innerHTML=`<img src="${x.src}" alt="">`;canvas.appendChild(el);makeDrag(el);select(el)}
function makeDrag(el){let sx,sy,l,t,down=false;el.onpointerdown=e=>{down=true;select(el);sx=e.clientX;sy=e.clientY;l=el.offsetLeft;t=el.offsetTop;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!down)return;el.style.left=(l+e.clientX-sx)+'px';el.style.top=(t+e.clientY-sy)+'px'};el.onpointerup=()=>down=false;el.onpointercancel=()=>down=false}
canvas.onclick=e=>{if(e.target===canvas)select(null)};
$('size').oninput=e=>{if(selected)selected.style.width=e.target.value+'%'};$('angle').oninput=e=>{if(selected){selected.dataset.angle=e.target.value;selected.style.transform=`translate(-50%,-50%) rotate(${e.target.value}deg)`}};
$('smaller').onclick=()=>{if(selected){$('size').value=Math.max(12,+$('size').value-5);$('size').oninput()}};$('larger').onclick=()=>{if(selected){$('size').value=Math.min(90,+$('size').value+5);$('size').oninput()}};
$('rotateL').onclick=()=>rotate(-15);$('rotateR').onclick=()=>rotate(15);function rotate(n){if(selected){let a=+(selected.dataset.angle||0)+n;while(a>180)a-=360;while(a<-180)a+=360;$('angle').value=a;$('angle').oninput()}}
$('delete').onclick=()=>{if(selected){selected.remove();select(null)}};$('clear').onclick=()=>{canvas.innerHTML='';select(null)};
$('addText').onclick=()=>{const text=prompt('Sticker text','GM DliCOM');if(!text)return;const el=document.createElement('div');el.className='layer';el.style.width='auto';el.style.fontSize='clamp(24px,5vw,48px)';el.style.fontWeight='1000';el.style.color='#fff';el.style.textShadow='0 4px 0 #174cc9,0 0 8px #000';el.style.whiteSpace='nowrap';el.style.zIndex=++z;el.textContent=text;canvas.appendChild(el);makeDrag(el);select(el)};
$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>addAsset({src:r.result,name:f.name});r.readAsDataURL(f)};
function trimCanvas(cv){const ctx=cv.getContext('2d'),d=ctx.getImageData(0,0,cv.width,cv.height),p=d.data,w=cv.width,h=cv.height;let minX=w,minY=h,maxX=-1,maxY=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(p[i+3]>18 && (p[i]>24||p[i+1]>24||p[i+2]>24)){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}if(maxX<0)return cv;const pad=Math.max(8,Math.round(Math.min(w,h)*.015)),x=Math.max(0,minX-pad),y=Math.max(0,minY-pad),ww=Math.min(w-x,maxX-minX+1+pad*2),hh=Math.min(h-y,maxY-minY+1+pad*2);const out=document.createElement('canvas');out.width=ww;out.height=hh;out.getContext('2d').drawImage(cv,x,y,ww,hh,0,0,ww,hh);return out}
function splitGrid(im,cols,rows,prefix){const w=im.naturalWidth,h=im.naturalHeight;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const cv=document.createElement('canvas');cv.width=Math.floor(w/cols);cv.height=Math.floor(h/rows);cv.getContext('2d').drawImage(im,c*cv.width,r*cv.height,cv.width,cv.height,0,0,cv.width,cv.height);const trimmed=trimCanvas(cv);A[cat];}}
function makeComponents(im){const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;const ctx=cv.getContext('2d');ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,cv.width,cv.height),p=d.data,w=cv.width,h=cv.height;const active=new Uint8Array(w*h);for(let i=0;i<w*h;i++){const j=i*4,r=p[j],g=p[j+1],b=p[j+2],a=p[j+3];active[i]=(a>20&&((r>28||g>28||b>28)))?1:0}const seen=new Uint8Array(w*h),boxes=[];const minArea=Math.max(150,w*h/12000);for(let sy=0;sy<h;sy+=2)for(let sx=0;sx<w;sx+=2){const si=sy*w+sx;if(!active[si]||seen[si])continue;let q=[si],head=0;seen[si]=1;let minx=sx,maxx=sx,miny=sy,maxy=sy,count=0;while(head<q.length){const v=q[head++],y=Math.floor(v/w),x=v-y*w;count++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;const ns=[v-2,v+2,v-w*2,v+w*2];for(const n of ns){if(n<0||n>=w*h)continue;const nx=n%w,ny=Math.floor(n/w);if(Math.abs(nx-x)>2||Math.abs(ny-y)>2||seen[n]||!active[n])continue;seen[n]=1;q.push(n)}}if(count>minArea&&(maxx-minx)>20&&(maxy-miny)>20)boxes.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,a:count})}boxes.sort((a,b)=>b.a-a.a);return boxes}
async function load(catKey){const im=new Image();im.crossOrigin='anonymous';im.src=RAW+sheets[catKey][0]+'?v=5';await new Promise(r=>{im.onload=r;im.onerror=r});if(!im.naturalWidth)return;const boxes=makeComponents(im);const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.getContext('2d').drawImage(im,0,0);let use=boxes;if(use.length<2){const g={mascot:[3,2],text:[3,3],gear:[4,4],base:[1,1],logo:[1,1]}[catKey];use=[];for(let r=0;r<g[1];r++)for(let c=0;c<g[0];c++)use.push({x:c*cv.width/g[0],y:r*cv.height/g[1],w:cv.width/g[0],h:cv.height/g[1]})}else use=use.slice(0,30);A[catKey]=use.map((b,i)=>{const o=document.createElement('canvas');o.width=Math.max(1,Math.ceil(b.w));o.height=Math.max(1,Math.ceil(b.h));o.getContext('2d').drawImage(cv,b.x,b.y,b.w,b.h,0,0,o.width,o.height);return{src:o.toDataURL('image/png'),name:catKey+'-'+(i+1)}})}
Promise.all(Object.keys(sheets).map(load)).then(()=>render());
$('download').onclick=async()=>{if(!canvas.children.length)return alert('Add a sticker first.');select(null);const shot=await html2canvas(canvas,{backgroundColor:null,scale:3,useCORS:true});const a=document.createElement('a');a.download='dlicom-sticker.png';a.href=shot.toDataURL('image/png');a.click()};
</script></body></html>
