<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DliCOM Sticker Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07122e;color:#fff;font-family:Arial,sans-serif;padding:16px}.app{max-width:1100px;margin:auto}h1{text-align:center;margin:8px 0 4px}p{text-align:center;color:#9fb1dc}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,.toolbar button{border:1px solid #31509a;background:#0d1c43;color:white;border-radius:10px;padding:10px 14px;font-weight:800}.tabs .active,.toolbar .primary{background:#2f6bff}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}.panel,.stage{background:#091535;border:1px solid #29427d;border-radius:18px;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.asset{aspect-ratio:1;border:1px solid #29427d;background:#050b20;border-radius:12px;overflow:hidden;cursor:pointer}.asset img{width:100%;height:100%;object-fit:contain}.canvasWrap{margin-top:12px;padding:15px;display:grid;place-items:center;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/22px 22px;border-radius:15px}.canvas{width:min(700px,100%);aspect-ratio:1;position:relative;overflow:hidden}.layer{position:absolute;left:50%;top:50%;width:35%;transform:translate(-50%,-50%);cursor:grab;touch-action:none}.layer img{width:100%;display:block;pointer-events:none}.selected{outline:2px solid #5e8dff;outline-offset:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.upload{display:block;text-align:center;border:1px dashed #5e8dff;border-radius:10px;padding:12px;margin-top:12px;cursor:pointer}.upload input{display:none}.hint{font-size:12px;color:#8296c4;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><h1>DliCOM Sticker Studio</h1><p>Create your own DliCOM stickers</p><div class="tabs"><button class="active" data-cat="mascot">Mascots</button><button data-cat="text">Text</button><button data-cat="gear">Accessories & Gear</button><button data-cat="logo">Logo</button></div><div class="layout"><aside class="panel"><div id="grid" class="grid"></div><label class="upload">Upload PNG/JPG<input id="upload" type="file" accept="image/png,image/jpeg,image/webp" multiple></label></aside><main class="stage"><div class="toolbar"><button class="primary" id="text">Add Text</button><button id="small">− Size</button><button id="big">+ Size</button><button id="del">Delete</button><button class="primary" id="export">Export Transparent PNG</button></div><div class="canvasWrap"><div id="canvas" class="canvas"></div></div><div class="hint">Tap an asset to add it. Drag to move. Resize or delete. Export keeps the transparent background.</div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>
const data={mascot:[],text:[],gear:[],logo:[]};let cat='mascot',selected=null,z=1;const grid=document.querySelector('#grid'),canvas=document.querySelector('#canvas');
function render(){grid.innerHTML=data[cat].length?data[cat].map((x,i)=>`<button class="asset" onclick="add(${i})"><img src="${x.src}"></button>`).join(''):'<div style="grid-column:1/-1;text-align:center;color:#8296c4;padding:25px;font-size:12px">Upload your transparent DliCOM assets here.</div>'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});
function add(i){const x=data[cat][i],e=document.createElement('div');e.className='layer';e.style.zIndex=++z;e.innerHTML=`<img src="${x.src}">`;e.onclick=a=>{a.stopPropagation();select(e)};drag(e);canvas.appendChild(e);select(e)}function select(e){if(selected)selected.classList.remove('selected');selected=e;if(e)e.classList.add('selected')}canvas.onclick=()=>select(null);
function drag(e){let sx,sy,l,t,down=false;e.onpointerdown=a=>{down=true;select(e);sx=a.clientX;sy=a.clientY;l=e.offsetLeft;t=e.offsetTop;e.setPointerCapture(a.pointerId)};e.onpointermove=a=>{if(!down)return;e.style.left=(l+a.clientX-sx)+'px';e.style.top=(t+a.clientY-sy)+'px'};e.onpointerup=()=>down=false}function size(k){if(!selected)return;selected.style.width=Math.max(12,Math.min(90,parseFloat(selected.style.width||35)+k))+'%'}document.querySelector('#small').onclick=()=>size(-5);document.querySelector('#big').onclick=()=>size(5);document.querySelector('#del').onclick=()=>{if(selected){selected.remove();selected=null}};document.querySelector('#text').onclick=()=>{let t=prompt('Sticker text','GM DliCOM');if(!t)return;let e=document.createElement('div');e.className='layer';e.style.width='auto';e.style.fontSize='36px';e.style.fontWeight='900';e.style.color='white';e.style.textShadow='0 3px 0 #1d49c9';e.textContent=t;e.style.zIndex=++z;canvas.appendChild(e);e.onclick=a=>{a.stopPropagation();select(e)};drag(e);select(e)};
document.querySelector('#upload').onchange=e=>[...e.target.files].forEach(f=>{let src=URL.createObjectURL(f),n=f.name.toLowerCase();let c=/gm|gn|lfg|wagmi|hodl|dyor|build|go|text/.test(n)?'text':/logo/.test(n)?'logo':/cap|head|goggle|cape|watch|bag|flag|mega|laptop|cup|binocular|drone|gear/.test(n)?'gear':'mascot';data[c].push({src,name:f.name});render()});
document.querySelector('#export').onclick=async()=>{if(!canvas.children.length)return alert('Add a sticker first');select(null);let shot=await html2canvas(canvas,{backgroundColor:null,scale:3});let a=document.createElement('a');a.download='dlicom-sticker.png';a.href=shot.toDataURL('image/png');a.click()};render();
</script></body></html>
